name: Android

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract engine version
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev-${GITHUB_SHA::7}")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Setup NDK Path & Dependencies
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDK_BIN" >> $GITHUB_PATH
          
          # Download sse2neon.h into src/ if not present
          if [ ! -f "src/sse2neon.h" ]; then
            curl -sL https://raw.githubusercontent.com/DLTcollab/sse2neon/master/sse2neon.h -o src/sse2neon.h
          fi

      - name: Patch Makefile & Memory Alignment for Android
        run: |
          # Update outdated NDK API level 21 to modern API level 28
          sed -i 's/android21/android28/g' Makefile

          # Replace std::aligned_alloc with Android-compatible memalign
          find src -type f \( -name "*.cc" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" \) -exec sed -i 's/std::aligned_alloc/memalign/g' {} +

      - name: Build Winter (ARM64 v8-A)
        run: |
          make clean || true
          make ARCH=aarch64 -j$(nproc)
          mv Winter Winter-${{ env.VERSION }}-android-arm64-v8a

      - name: Build Winter (ARM64 DotProd - Cortex A76+)
        run: |
          make clean || true
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          make ARCH=aarch64 CXX="$NDK_CXX" CFLAGS="-c -DNDEBUG -D_ARM -O3 -flto -Wall -Wno-sign-compare -m64 -march=armv8.2-a+dotprod+crypto -std=c++17 -Isrc -Isrc/general -Isrc/learning" -j$(nproc)
          mv Winter Winter-${{ env.VERSION }}-android-arm64-dotprod

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winter-${{ env.VERSION }}-android-binaries
          path: |
            Winter-${{ env.VERSION }}-android-arm64-v8a
            Winter-${{ env.VERSION }}-android-arm64-dotprod
